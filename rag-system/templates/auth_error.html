<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Authentication Error</title>
  <style>
    body { font-family: system-ui; background: #0f1117; color: #e2e6f3; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1a1d27; border: 1px solid #2e3350; border-radius: 12px; padding: 32px 40px; max-width: 500px; text-align: center; }
    h1 { font-size: 1.1rem; color: #e05c5c; margin-bottom: 12px; }
    p { color: #8a90ad; font-size: 0.88rem; line-height: 1.6; margin-bottom: 20px; }
    a { display: inline-block; padding: 8px 20px; background: #6c8eff; color: #fff; border-radius: 7px; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Microsoft Authentication Error</h1>
    <p>{{ error }}</p>
    <a href="/">Return to app</a>
  </div>
</body>
</html>
